# Production pipeline: approval → Exchange publish → CH2 deploy (EMEA).
# Triggered on every merge to main.
#
# Region control:  vars.DEPLOY_EMEA  (true | false)
# Region BG IDs:   vars.EMEA_BG_ID   (org-level variable)
# CH2 target:      vars.EMEA_CH2_TARGET
#
# exchange-publish-regional.yml handles: build, version set, groupId alignment,
# Exchange publish, and artifact upload — all in one job so the release version
# is consistent throughout (avoids the SNAPSHOT→release version mismatch that
# caused Exchange 404 when publish and deploy were in separate jobs).
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  # ── EMEA: approval → publish → deploy ────────────────────────────────────

  emea-approve:
    name: Approve EMEA release
    if: ${{ vars.DEPLOY_EMEA == 'true' }}
    runs-on: ubuntu-latest
    environment: emea-gate
    steps:
      - run: echo "EMEA release approved"

  publish-emea:
    name: Build → Exchange (EMEA)
    needs: emea-approve
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/exchange-publish-regional.yml@main
    with:
      region_bg_id: ${{ vars.EMEA_BG_ID }}
      artifact_name: mule-app-emea
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  emea-deploy:
    name: Deploy Production (EMEA)
    needs: publish-emea
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven (EMEA prod credentials)
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
          exchange_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
          github_token: ${{ github.token }}

      - name: Set pom version to published release version
        run: |
          # The publish job set a release version (MAJOR.MINOR.run_number).
          # Align the checked-out pom to that exact version so the CH2 deploy
          # finds the Exchange asset by the same coordinates.
          echo "Published version: ${{ needs.publish-emea.outputs.release_version }}"
          $MVN versions:set \
            -DnewVersion="${{ needs.publish-emea.outputs.release_version }}" \
            -DgenerateBackupFiles=false --no-transfer-progress --batch-mode

      - name: Download Mule JAR
        uses: actions/download-artifact@v4
        with:
          name: mule-app-emea
          path: target/

      - name: Deploy to CloudHub 2.0 — EMEA Production
        env:
          # connected_app: Connected App that orchestrates the CH2 deployment.
          CONNECTED_APP_CLIENT_ID: ${{ secrets.EMEA_PROD_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
          # env_client: Anypoint environment client_id/secret for runtime access.
          # TODO: provision a separate env-scoped Connected App for least-privilege.
          ENV_CLIENT_ID: ${{ secrets.EMEA_PROD_CLIENT_ID }}
          ENV_CLIENT_SECRET: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
          SECURE_KEY: ${{ secrets.EMEA_PROD_SECURE_KEY }}
        run: |
          JAR=$(find target -name "*-mule-application.jar" | head -1)
          echo "Deploying JAR: ${JAR}"
          $MVN mule:deploy -P ch2 \
            -Ddeployment.name="${{ github.event.repository.name }}" \
            -Dbg.id=${{ vars.EMEA_BG_ID }} \
            -Dch2.environment="Production" \
            -Dapp.target=${{ vars.EMEA_CH2_TARGET }} \
            -Dapp.replicas="2" \
            -Dapp.vcores="0.2" \
            -Dapp.runtime="${{ vars.MULE_RUNTIME || '4.9.0' }}" \
            -Dconnected.app.client.id="${CONNECTED_APP_CLIENT_ID}" \
            -Dconnected.app.client.secret="${CONNECTED_APP_CLIENT_SECRET}" \
            -Denv.client.id="${ENV_CLIENT_ID}" \
            -Denv.client.secret="${ENV_CLIENT_SECRET}" \
            -Dsecure.key="${SECURE_KEY}" \
            -Dmule.artifact="${JAR}" \
            --no-transfer-progress --batch-mode
