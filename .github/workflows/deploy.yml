name: Deploy to Production

on:
  workflow_run:
    workflows: ["Publish to Exchange"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  gate:
    name: Production gate
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: emea-gate
    steps:
      - run: echo "Gate passed for ${{ github.event.workflow_run.head_sha }}"
