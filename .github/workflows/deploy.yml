# Production pipeline: Exchange publish (per region) → approval gate → CH2 deploy.
# Triggered on every merge to main.
#
# Region control:  vars.DEPLOY_EMEA  and  vars.DEPLOY_AMER  (true | false)
# Region BG IDs:   vars.EMEA_BG_ID   and  vars.AMER_BG_ID   (org-level variables)
# CH2 targets:     vars.EMEA_CH2_TARGET and vars.AMER_CH2_TARGET
#
# Each enabled region:
#   1. Publishes to Exchange under the regional BG UUID
#      (exchange-publish-regional.yml handles the groupId alignment internally)
#   2. Waits for the regional approver team on the production environment
#   3. Deploys to CloudHub 2.0
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  # ── EMEA: publish → approval → deploy ────────────────────────────────────

  publish-emea:
    name: Publish to Exchange (EMEA)
    if: ${{ vars.DEPLOY_EMEA == 'true' }}
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/exchange-publish-regional.yml@main
    with:
      region_bg_id: ${{ vars.EMEA_BG_ID }}
      artifact_name: mule-app-emea
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  emea-production-gate:
    name: Await EMEA production approval
    needs: publish-emea
    runs-on: ubuntu-latest
    environment: emea-prod
    steps:
      - run: echo "EMEA production approved"

  emea-production:
    name: Deploy Production (EMEA)
    needs: emea-production-gate
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app-emea
      artifact_run_id: ''
      bg_id: ${{ vars.EMEA_BG_ID }}
      anypoint_env: 'Production'
      ch2_target: ${{ vars.EMEA_CH2_TARGET }}
      app_name: ${{ github.event.repository.name }}
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.EMEA_PROD_SECURE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  # ── AMER: publish → approval → deploy ────────────────────────────────────

  publish-amer:
    name: Publish to Exchange (AMER)
    if: ${{ vars.DEPLOY_AMER == 'true' }}
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/exchange-publish-regional.yml@main
    with:
      region_bg_id: ${{ vars.AMER_BG_ID }}
      artifact_name: mule-app-amer
    secrets:
      connected_app_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}

  amer-production-gate:
    name: Await AMER production approval
    needs: publish-amer
    runs-on: ubuntu-latest
    environment: amer-prod
    steps:
      - run: echo "AMER production approved"

  amer-production:
    name: Deploy Production (AMER)
    needs: amer-production-gate
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app-amer
      artifact_run_id: ''
      bg_id: ${{ vars.AMER_BG_ID }}
      anypoint_env: 'Production'
      ch2_target: ${{ vars.AMER_CH2_TARGET }}
      app_name: ${{ github.event.repository.name }}
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_PROD_SECURE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
