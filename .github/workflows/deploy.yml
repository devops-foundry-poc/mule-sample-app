# Production pipeline: approval → Exchange publish → CH2 deploy (EMEA).
# Triggered on every merge to main.
#
# EMEA-only for now (DEPLOY_AMER=false). The pom.xml groupId is already the
# EMEA BG UUID (57c5735b) — no groupId change is needed before Exchange publish.
#
# Region control:  vars.DEPLOY_EMEA  (true | false)
# Region BG IDs:   vars.EMEA_BG_ID   (org-level variable)
# CH2 target:      vars.EMEA_CH2_TARGET
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  # ── EMEA: approval → publish → deploy ────────────────────────────────────

  emea-approve:
    name: Approve EMEA release
    if: ${{ vars.DEPLOY_EMEA == 'true' }}
    runs-on: ubuntu-latest
    environment: emea-gate
    steps:
      - run: echo "EMEA release approved"

  publish-emea:
    name: Build → Exchange (EMEA)
    needs: emea-approve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
          exchange_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
          github_token: ${{ github.token }}

      - name: Set release version (MAJOR.MINOR.run_number)
        id: version
        run: |
          BASE=$($MVN help:evaluate -Dexpression=project.version -q -DforceStdout \
            --no-transfer-progress --batch-mode)
          MAJOR_MINOR=$(echo "${BASE%-SNAPSHOT}" | cut -d. -f1,2)
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          $MVN versions:set -DnewVersion="${VERSION}" \
            -DgenerateBackupFiles=false --no-transfer-progress --batch-mode
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Publishing: ${VERSION} to EMEA Exchange (${{ vars.EMEA_BG_ID }})"

      - name: Publish to Exchange (EMEA BG)
        run: |
          # pom.xml groupId is already the EMEA BG UUID — no change needed.
          $MVN deploy -P deploy-to-exchange-v3 \
            -DexchangeGroupId=${{ vars.EMEA_BG_ID }} \
            --no-transfer-progress --batch-mode

      - name: Upload Mule JAR
        uses: actions/upload-artifact@v4
        with:
          name: mule-app-emea
          path: target/*-mule-application.jar
          if-no-files-found: error
          retention-days: 7

  emea-production:
    name: Deploy Production (EMEA)
    needs: publish-emea
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app-emea
      artifact_run_id: ''
      bg_id: ${{ vars.EMEA_BG_ID }}
      anypoint_env: 'Production'
      ch2_target: ${{ vars.EMEA_CH2_TARGET }}
      app_name: ${{ github.event.repository.name }}
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.EMEA_PROD_SECURE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
