# Manual lower-environment deploy for pre-merge testing.
# Run this from any branch (feature or main) to deploy to Design or Sandbox.
#
# CloudHub 2.0 requires the application to exist in Anypoint Exchange before
# it can be deployed. This workflow: builds → publishes to Exchange with a
# unique version (base.run_number) → deploys to CH2.
# The unique version avoids 409 conflicts on repeated runs from the same branch.
#
# Typical usage:
#   1. Develop on feature/<ticket>-<desc>
#   2. Trigger this workflow → Deploy to Design → test
#   3. If good, trigger again → Deploy to Sandbox → test
#   4. Open PR → merge to main → deploy.yml handles Production
name: Deploy to lower environment

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Anypoint environment name (must match Runtime Manager exactly)'
        type: choice
        options:
          - Design
          - Sandbox
        default: Design
        required: true
      region:
        description: 'Deployment region'
        type: choice
        options:
          - emea
          - amer
        default: emea
        required: true

permissions:
  contents: read
  packages: read

jobs:
  build-publish-deploy:
    name: Build → Exchange → CH2 ${{ inputs.target_env }} (${{ inputs.region }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java 17
        # TODO: pin to SHA — gh release view v4 -R actions/setup-java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_ID
                || secrets.AMER_NONPROD_CLIENT_ID }}
          exchange_client_secret: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_SECRET
                || secrets.AMER_NONPROD_CLIENT_SECRET }}
          github_token: ${{ github.token }}

      - name: Set unique version (base.run_number to avoid Exchange 409)
        id: version
        run: |
          BASE=$($MVN help:evaluate -Dexpression=project.version -q -DforceStdout \
            --no-transfer-progress --batch-mode)
          RELEASE="${BASE%-SNAPSHOT}"
          UNIQUE="${RELEASE}.${{ github.run_number }}"
          $MVN versions:set -DnewVersion="${UNIQUE}" \
            -DgenerateBackupFiles=false --no-transfer-progress --batch-mode
          echo "version=${UNIQUE}" >> "$GITHUB_OUTPUT"
          echo "Publishing version: ${UNIQUE}"

      - name: Publish to Exchange
        env:
          BG_ID: >-
            ${{ inputs.region == 'emea'
                && '57c5735b-b5cd-474c-b978-c9bdb69fb472'
                || '3d315b55-1b77-40a0-9e6b-301ef87e93d1' }}
        run: |
          $MVN deploy -P deploy-to-exchange-v3 \
            -DorganizationId="${BG_ID}" \
            --no-transfer-progress --batch-mode

      - name: Deploy to CloudHub 2.0 — ${{ inputs.target_env }} (${{ inputs.region }})
        env:
          CONNECTED_APP_CLIENT_ID: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_ID
                || secrets.AMER_NONPROD_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_SECRET
                || secrets.AMER_NONPROD_CLIENT_SECRET }}
          ENV_CLIENT_ID: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_ID
                || secrets.AMER_NONPROD_CLIENT_ID }}
          ENV_CLIENT_SECRET: >-
            ${{ inputs.region == 'emea'
                && secrets.EMEA_NONPROD_CLIENT_SECRET
                || secrets.AMER_NONPROD_CLIENT_SECRET }}
          SECURE_KEY: >-
            ${{ inputs.region == 'emea'
                && (inputs.target_env == 'Design' && secrets.EMEA_DESIGN_SECURE_KEY || secrets.EMEA_SANDBOX_SECURE_KEY)
                || (inputs.target_env == 'Design' && secrets.AMER_DESIGN_SECURE_KEY  || secrets.AMER_SANDBOX_SECURE_KEY) }}
          BG_ID: >-
            ${{ inputs.region == 'emea'
                && '57c5735b-b5cd-474c-b978-c9bdb69fb472'
                || '3d315b55-1b77-40a0-9e6b-301ef87e93d1' }}
          CH2_TARGET: >-
            ${{ inputs.region == 'emea'
                && vars.EMEA_CH2_TARGET
                || vars.AMER_CH2_TARGET }}
          APP_SUFFIX: ${{ inputs.target_env == 'Design' && 'dev' || 'test' }}
        run: |
          $MVN mule:deploy -P ch2 \
            -Ddeployment.name="${{ github.event.repository.name }}-${APP_SUFFIX}" \
            -Dbg.id="${BG_ID}" \
            -Dch2.environment="${{ inputs.target_env }}" \
            -Dapp.target="${CH2_TARGET}" \
            -Dapp.replicas="1" \
            -Dapp.vcores="0.1" \
            -Dapp.runtime="${{ vars.MULE_RUNTIME || '4.9.0' }}" \
            -Dconnected.app.client.id="${CONNECTED_APP_CLIENT_ID}" \
            -Dconnected.app.client.secret="${CONNECTED_APP_CLIENT_SECRET}" \
            -Denv.client.id="${ENV_CLIENT_ID}" \
            -Denv.client.secret="${ENV_CLIENT_SECRET}" \
            -Dsecure.key="${SECURE_KEY}" \
            --no-transfer-progress --batch-mode
