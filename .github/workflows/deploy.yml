# Regional promotion pipeline: Design → Sandbox → Production.
# Triggered when the "Publish to Exchange" workflow completes successfully on main.
#
# ── Region control (repository variables) ────────────────────────────────────
# Set these in:  this repo → Settings → Secrets and variables → Variables
#
#   DEPLOY_EMEA   true | false
#   DEPLOY_AMER   true | false
#
# ── Behaviour ────────────────────────────────────────────────────────────────
#   Both true  → the workflow pauses at approve-emea / approve-amer and waits
#                for each region's approver team to decide before any deployment
#                starts for that region.  The two gates run in parallel so the
#                teams decide independently.
#   One true   → that region's track starts automatically (no gate).
#   Both false → all deploy jobs are skipped.
#
# ── Gate environments (pre-deployment, both-region mode only) ────────────────
#   emea-gate  → required reviewer: mule-approvers-emea
#   amer-gate  → required reviewer: mule-approvers-amer
#
# ── Deployment environment gates ─────────────────────────────────────────────
#   *-dev, *-test  — no approval (auto-promotion through the stages)
#   emea-prod      — required reviewer: mule-approvers-emea
#   amer-prod      — required reviewer: mule-approvers-amer
name: Deploy

on:
  workflow_run:
    workflows: ["Publish to Exchange"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read   # required for cross-run artifact download

jobs:
  # ── Pre-deployment gates ──────────────────────────────────────────────────
  # These jobs only activate when BOTH regions are enabled.
  # When only one region is active the gate is skipped and the
  # downstream track proceeds without waiting.

  approve-emea:
    name: Approve EMEA deployment
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_EMEA == 'true' && vars.DEPLOY_AMER == 'true' }}
    runs-on: ubuntu-latest
    environment: emea-gate   # pauses here — mule-approvers-emea must approve
    steps:
      - run: echo "EMEA deployment approved"

  approve-amer:
    name: Approve AMER deployment
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_EMEA == 'true' && vars.DEPLOY_AMER == 'true' }}
    runs-on: ubuntu-latest
    environment: amer-gate   # pauses here — mule-approvers-amer must approve
    steps:
      - run: echo "AMER deployment approved"

  # ════════════════════════════════════════════════════════════════════════════
  # EMEA track  (Design → Sandbox → Production)
  # Proceeds automatically when DEPLOY_EMEA=true and DEPLOY_AMER=false.
  # Waits for approve-emea when both regions are active.
  # ════════════════════════════════════════════════════════════════════════════

  emea-design:
    name: EMEA — Design
    needs: [approve-emea]
    # Run when:
    #   • EMEA is enabled, AND
    #   • the publish succeeded, AND
    #   • the gate either approved (both-region) or was skipped (single-region).
    if: >-
      ${{ vars.DEPLOY_EMEA == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          (needs.approve-emea.result == 'success' ||
           needs.approve-emea.result == 'skipped') }}
    environment: emea-dev
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '57c5735b-b5cd-474c-b978-c9bdb69fb472'
      anypoint_env: 'Design'
      app_name: '${{ github.event.repository.name }}-dev'
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.EMEA_DESIGN_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  emea-sandbox:
    name: EMEA — Sandbox
    needs: emea-design
    environment: emea-test
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '57c5735b-b5cd-474c-b978-c9bdb69fb472'
      anypoint_env: 'Sandbox'
      app_name: '${{ github.event.repository.name }}-test'
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.EMEA_SANDBOX_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  emea-production:
    name: EMEA — Production
    needs: emea-sandbox
    environment: emea-prod   # approval gate: mule-approvers-emea
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '57c5735b-b5cd-474c-b978-c9bdb69fb472'
      anypoint_env: 'Production'
      app_name: '${{ github.event.repository.name }}'
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.EMEA_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.EMEA_PROD_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  # ════════════════════════════════════════════════════════════════════════════
  # AMER track  (Design → Sandbox → Production)
  # Proceeds automatically when DEPLOY_AMER=true and DEPLOY_EMEA=false.
  # Waits for approve-amer when both regions are active.
  # ════════════════════════════════════════════════════════════════════════════

  amer-design:
    name: AMER — Design
    needs: [approve-amer]
    if: >-
      ${{ vars.DEPLOY_AMER == 'true' &&
          github.event.workflow_run.conclusion == 'success' &&
          (needs.approve-amer.result == 'success' ||
           needs.approve-amer.result == 'skipped') }}
    environment: amer-dev
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Design'
      app_name: '${{ github.event.repository.name }}-dev'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_DESIGN_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  amer-sandbox:
    name: AMER — Sandbox
    needs: amer-design
    environment: amer-test
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Sandbox'
      app_name: '${{ github.event.repository.name }}-test'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_SANDBOX_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}

  amer-production:
    name: AMER — Production
    needs: amer-sandbox
    environment: amer-prod   # approval gate: mule-approvers-amer
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Production'
      app_name: '${{ github.event.repository.name }}'
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_PROD_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
