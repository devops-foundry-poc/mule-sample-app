# AMER regional promotion pipeline: Design → Sandbox → Production.
# Triggered when the "Publish to Exchange" workflow completes successfully on main.
# Runs in parallel with deploy-emea.yml (dual-region independence).
#
# Environment gates:
#   amer-dev  — no approval required
#   amer-test — no approval required
#   amer-prod — requires approval from mule-approvers-amer team
#
# Prod secrets (AMER_PROD_CLIENT_ID/_SECRET) are wired but unusable
# until the Connected App is created and the org secrets are populated.
name: Deploy AMER

on:
  workflow_run:
    workflows: ["Publish to Exchange"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # ── Stage 1: Design (auto) ─────────────────────────────────────────────────
  deploy-design:
    name: Deploy to Design (AMER)
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    environment: amer-dev
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Design'
      app_name: '${{ github.event.repository.name }}-dev'
      # TO CONFIRM: US CloudHub 2.0 region.
      mule_runtime: '4.9.0'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_DESIGN_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
      mulesoft_ee_username: ${{ secrets.MULESOFT_EE_USERNAME }}
      mulesoft_ee_password: ${{ secrets.MULESOFT_EE_PASSWORD }}

  # ── Stage 2: Sandbox (auto after Design) ───────────────────────────────────
  deploy-sandbox:
    name: Deploy to Sandbox (AMER)
    needs: deploy-design
    environment: amer-test
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Sandbox'
      app_name: '${{ github.event.repository.name }}-test'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_NONPROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_NONPROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_SANDBOX_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
      mulesoft_ee_username: ${{ secrets.MULESOFT_EE_USERNAME }}
      mulesoft_ee_password: ${{ secrets.MULESOFT_EE_PASSWORD }}

  # ── Stage 3: Production (gated — mule-approvers-amer approval required) ────
  deploy-production:
    name: Deploy to Production (AMER)
    needs: deploy-sandbox
    environment: amer-prod   # GitHub environment: approval gate from mule-approvers-amer
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      anypoint_env: 'Production'
      app_name: '${{ github.event.repository.name }}'
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      connected_app_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      env_client_id: ${{ secrets.AMER_PROD_CLIENT_ID }}
      env_client_secret: ${{ secrets.AMER_PROD_CLIENT_SECRET }}
      secure_key: ${{ secrets.AMER_PROD_SECURE_KEY }}
      github_token: ${{ secrets.GITHUB_TOKEN }}
      mulesoft_ee_username: ${{ secrets.MULESOFT_EE_USERNAME }}
      mulesoft_ee_password: ${{ secrets.MULESOFT_EE_PASSWORD }}
