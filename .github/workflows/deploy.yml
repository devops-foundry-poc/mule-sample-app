# Production promotion pipeline.
# Triggered automatically when the "Publish to Exchange" workflow completes
# successfully on main.  Design and Sandbox deploys are handled separately
# via deploy-lower.yml (workflow_dispatch) so they can be tested before
# the code is merged to main.
#
# ── Region control (repository variables) ────────────────────────────────────
# Set in:  this repo → Settings → Secrets and variables → Variables
#   DEPLOY_EMEA   true | false
#   DEPLOY_AMER   true | false
#
# ── Behaviour ────────────────────────────────────────────────────────────────
# Both true  → approve-emea and approve-amer gates run in parallel; each
#              regional approver team decides independently before that
#              region's production deployment starts.
# One true   → that region deploys automatically (gate is skipped).
name: Deploy to Production

on:
  workflow_run:
    workflows: ["Publish to Exchange"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  # ── Pre-production gates (both-region mode only) ──────────────────────────

  approve-emea:
    name: Approve EMEA production deployment
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_EMEA == 'true' && vars.DEPLOY_AMER == 'true' }}
    runs-on: ubuntu-latest
    environment: emea-gate
    steps:
      - run: echo "EMEA production deployment approved"

  approve-amer:
    name: Approve AMER production deployment
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          vars.DEPLOY_EMEA == 'true' && vars.DEPLOY_AMER == 'true' }}
    runs-on: ubuntu-latest
    environment: amer-gate
    steps:
      - run: echo "AMER production deployment approved"

  # ── Production approval gate ─────────────────────────────────────────────

  deploy-production-gate:
    name: Await production approval (${{ matrix.region }})
    needs: [approve-emea, approve-amer]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - region: emea
          - region: amer
      fail-fast: false
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          ((matrix.region == 'emea' && vars.DEPLOY_EMEA == 'true' &&
            (needs.approve-emea.result == 'success' || needs.approve-emea.result == 'skipped')) ||
           (matrix.region == 'amer' && vars.DEPLOY_AMER == 'true' &&
            (needs.approve-amer.result == 'success' || needs.approve-amer.result == 'skipped'))) }}
    environment: ${{ matrix.region }}-prod
    steps:
      - run: echo "Production deployment approved for ${{ matrix.region }}"

  # ── Production deploy ─────────────────────────────────────────────────────

  deploy-production:
    name: Deploy Production (${{ matrix.region }})
    needs: deploy-production-gate
    strategy:
      matrix:
        include:
          - region: emea
            bg_id: '57c5735b-b5cd-474c-b978-c9bdb69fb472'
          - region: amer
            bg_id: '3d315b55-1b77-40a0-9e6b-301ef87e93d1'
      fail-fast: false
    uses: devops-foundry-poc/mule-cicd-workflows/.github/workflows/ch2-deploy.yml@main
    with:
      artifact_name: mule-app
      artifact_run_id: ${{ github.event.workflow_run.id }}
      bg_id: ${{ matrix.bg_id }}
      anypoint_env: 'Production'
      app_name: '${{ github.event.repository.name }}'
      replicas: '2'
      vcores: '0.2'
    secrets:
      connected_app_client_id: >-
        ${{ matrix.region == 'emea'
            && secrets.EMEA_PROD_CLIENT_ID
            || secrets.AMER_PROD_CLIENT_ID }}
      connected_app_client_secret: >-
        ${{ matrix.region == 'emea'
            && secrets.EMEA_PROD_CLIENT_SECRET
            || secrets.AMER_PROD_CLIENT_SECRET }}
      env_client_id: >-
        ${{ matrix.region == 'emea'
            && secrets.EMEA_PROD_CLIENT_ID
            || secrets.AMER_PROD_CLIENT_ID }}
      env_client_secret: >-
        ${{ matrix.region == 'emea'
            && secrets.EMEA_PROD_CLIENT_SECRET
            || secrets.AMER_PROD_CLIENT_SECRET }}
      secure_key: >-
        ${{ matrix.region == 'emea'
            && secrets.EMEA_PROD_SECURE_KEY
            || secrets.AMER_PROD_SECURE_KEY }}
      gh_token: ${{ secrets.GITHUB_TOKEN }}
