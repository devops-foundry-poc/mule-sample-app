# Production pipeline: approval → build+Exchange publish+CH2 deploy (EMEA).
# All three steps run in ONE JOB so the pom.xml release version set during
# the build is visible to the mule:deploy step.
# (If publish and deploy were in separate jobs, the deploy job would check
# out fresh code with the SNAPSHOT version, causing Exchange lookup 404.)
#
# Region control:  vars.DEPLOY_EMEA  (true | false)
# Region BG IDs:   vars.EMEA_BG_ID   (org-level variable)
# CH2 target:      vars.EMEA_CH2_TARGET
name: Deploy to Production

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  # ── EMEA: approval gate ───────────────────────────────────────────────────

  emea-approve:
    name: Approve EMEA release
    if: ${{ vars.DEPLOY_EMEA == 'true' }}
    runs-on: ubuntu-latest
    environment: emea-gate
    steps:
      - run: echo "EMEA release approved"

  # ── EMEA: build → Exchange publish → CH2 deploy (single job) ─────────────

  emea-deploy:
    name: Build → Exchange → CH2 Production (EMEA)
    needs: emea-approve
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Configure Maven (EMEA credentials)
        uses: devops-foundry-poc/mule-cicd-workflows/.github/actions/configure-maven@main
        with:
          exchange_client_id: ${{ secrets.EMEA_NONPROD_CLIENT_ID }}
          exchange_client_secret: ${{ secrets.EMEA_NONPROD_CLIENT_SECRET }}
          github_token: ${{ github.token }}

      - name: Set release version (MAJOR.MINOR.run_number)
        id: version
        run: |
          BASE=$($MVN help:evaluate -Dexpression=project.version -q -DforceStdout \
            --no-transfer-progress --batch-mode)
          MAJOR_MINOR=$(echo "${BASE%-SNAPSHOT}" | cut -d. -f1,2)
          VERSION="${MAJOR_MINOR}.${{ github.run_number }}"
          $MVN versions:set -DnewVersion="${VERSION}" \
            -DgenerateBackupFiles=false --no-transfer-progress --batch-mode
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Release version: ${VERSION}"

      - name: Build and publish to EMEA Exchange
        run: |
          $MVN deploy -P deploy-to-exchange-v3 \
            -DexchangeGroupId=${{ vars.EMEA_BG_ID }} \
            --no-transfer-progress --batch-mode

      - name: Deploy to CloudHub 2.0 — EMEA Production
        env:
          # connected_app: Connected App that orchestrates the CH2 deployment (client_credentials grant).
          CONNECTED_APP_CLIENT_ID: ${{ secrets.EMEA_PROD_CLIENT_ID }}
          CONNECTED_APP_CLIENT_SECRET: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
          # env_client: Anypoint environment client credentials (anypoint.platform.client_id/secret).
          # Ideally a separate app scoped to the Production environment only.
          # Currently reuses the prod Connected App — split when a dedicated env app is provisioned.
          ENV_CLIENT_ID: ${{ secrets.EMEA_PROD_CLIENT_ID }}
          ENV_CLIENT_SECRET: ${{ secrets.EMEA_PROD_CLIENT_SECRET }}
          SECURE_KEY: ${{ secrets.EMEA_PROD_SECURE_KEY }}
        run: |
          # Find the built JAR
          JAR=$(find target -name "*-mule-application.jar" | head -1)
          echo "Deploying: ${JAR}"

          $MVN mule:deploy -P ch2 \
            -Ddeployment.name="${{ github.event.repository.name }}" \
            -Dbg.id=${{ vars.EMEA_BG_ID }} \
            -Dch2.environment="Production" \
            -Dapp.target=${{ vars.EMEA_CH2_TARGET }} \
            -Dapp.replicas="2" \
            -Dapp.vcores="0.2" \
            -Dapp.runtime="${{ vars.MULE_RUNTIME || '4.9.0' }}" \
            -Dconnected.app.client.id="${CONNECTED_APP_CLIENT_ID}" \
            -Dconnected.app.client.secret="${CONNECTED_APP_CLIENT_SECRET}" \
            -Denv.client.id="${ENV_CLIENT_ID}" \
            -Denv.client.secret="${ENV_CLIENT_SECRET}" \
            -Dsecure.key="${SECURE_KEY}" \
            -Dmule.artifact="${JAR}" \
            --no-transfer-progress --batch-mode
