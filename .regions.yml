# Documentation: intended deployment regions for this application.
# This file is for human reference only.
#
# The ACTIVE deployment regions are controlled by the GitHub repository variable
# DEPLOY_REGIONS (repo Settings → Secrets and variables → Variables).
# Set it to a comma-separated list of region keys, e.g. "emea,amer", "emea", "amer".
#
# Available regions and their Anypoint Business Group IDs:
regions:
  emea:
    bg_id: 57c5735b-b5cd-474c-b978-c9bdb69fb472
    environments: [Design, Sandbox, Production]
    github_environments: [emea-dev, emea-test, emea-prod]
    prod_approver_team: mule-approvers-emea
  amer:
    bg_id: 3d315b55-1b77-40a0-9e6b-301ef87e93d1
    environments: [Design, Sandbox, Production]
    github_environments: [amer-dev, amer-test, amer-prod]
    prod_approver_team: mule-approvers-amer
